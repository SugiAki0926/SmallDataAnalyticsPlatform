# ~/.dbt/profiles.ymlとして配置され、開発ではユーザーごとにスキーマを分離するのが一般的かも
# DBT_SCHEMA=dev_XXX, # schema: "{{ env_var('dev_XXX', 'dev') }}"
dap_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | as_number }}"
      user: "{{ env_var('DBT_DB_USER') }}"
      password: "{{ env_var('DBT_DB_PASSWORD') }}"
      dbname: "{{ env_var('ANALYTICS_DB') }}"
      schema: dev
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | as_number }}"
      user: "{{ env_var('DBT_DB_USER') }}"
      password: "{{ env_var('DBT_DB_PASSWORD') }}"
      dbname: "{{ env_var('ANALYTICS_DB') }}"
      schema: prod
