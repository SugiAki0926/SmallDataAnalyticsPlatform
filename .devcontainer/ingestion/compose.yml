# PostgreSQL 用 compose.dev.yml とは別。dap-dev は作らず、既存に参加する。
services:
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dap-ingestion
    working_dir: /workspaces/SmallDataAnalyticsPlatform
    volumes:
      - ../..:/workspaces/SmallDataAnalyticsPlatform
    env_file:
      - ../../.env
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    command: sleep infinity
    networks:
      - dap-dev

networks:
  dap-dev:
    external: true
