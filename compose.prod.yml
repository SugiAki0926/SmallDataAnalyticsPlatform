# Airflowの各コンテナの共通設定(top level)
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: dap-airflow:latest
  environment: &airflow-env
    TZ: ${TZ:-Asia/Tokyo}
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL:-http://airflow-api-server:8080/execution/}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  volumes:
    - dap_prod_airflow_logs:/opt/airflow/logs
  networks:
    - dap-prod

services:
  postgres:
    image: postgres:16
    container_name: dap-prod-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      PGTZ: ${TZ:-Asia/Tokyo}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SOURCE_DB: ${SOURCE_DB}
      SOURCE_DB_USER: ${SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
      ANALYTICS_DB: ${ANALYTICS_DB}
      DLT_DB_USER: ${DLT_DB_USER}
      DLT_DB_PASSWORD: ${DLT_DB_PASSWORD}
      DBT_DB_USER: ${DBT_DB_USER}
      DBT_DB_PASSWORD: ${DBT_DB_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    command: [ "postgres", "-c", "timezone=${TZ:-Asia/Tokyo}" ]
    volumes:
      - dap_prod_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dap-prod
    healthcheck:
      # $POSTGRES_USERとして展開させるために$$を使用
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: dap-prod-airflow-init
    command: [ "airflow", "db", "migrate" ]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    container_name: dap-prod-airflow-api-server
    command: [ "airflow", "api-server", "--host", "0.0.0.0", "--port", "8080" ]
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      <<: *airflow-env
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_UI_USER}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
    volumes:
      # volumes を書くと共通設定が置き換わるため、ログ用 volume も繰り返す。
      - dap_prod_airflow_logs:/opt/airflow/logs
      # デプロイ前にホストへ {"<AIRFLOW_UI_USER>":"<password>"} を置く。
      - ./secrets/airflow_ui_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: dap-prod-airflow-scheduler
    command: [ "airflow", "scheduler" ]
    restart: unless-stopped
    volumes:
      # socket 用に volumesを書いたので共通設定が反映されないため記載。
      - dap_prod_airflow_logs:/opt/airflow/logs
      # Schedulerコンテナ内のDockerOperatorがHost Docker Engineと通信するために必要
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: dap-prod-airflow-dag-processor
    command: [ "airflow", "dag-processor" ]
    restart: unless-stopped
    # elt.py はパース時に os.environ を読む。パースするのはこのコンテナだけ。
    environment:
      <<: *airflow-env
      DAP_DOCKER_NETWORK: dap-prod # dlt / dbt コンテナが PostgreSQL と通信するため
      DBT_TARGET: prod
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ANALYTICS_DB: ${ANALYTICS_DB}
      SOURCE_DB: ${SOURCE_DB}
      DLT_DB_USER: ${DLT_DB_USER}
      DLT_DB_PASSWORD: ${DLT_DB_PASSWORD}
      DBT_DB_USER: ${DBT_DB_USER}
      DBT_DB_PASSWORD: ${DBT_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # 単発ジョブ用のコンテナ(OpenWeather API → Source DB)
  source-ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    image: dap-source-ingestion:latest
    profiles:
      - job
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SOURCE_DB: ${SOURCE_DB}
      SOURCE_DB_USER: ${SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      OPENWEATHER_BASE_URL: ${OPENWEATHER_BASE_URL}
      OPENWEATHER_CITY_ID: ${OPENWEATHER_CITY_ID}
      OPENWEATHER_CITY_QUERY: ${OPENWEATHER_CITY_QUERY}
      OPENWEATHER_FORECAST_CNT: ${OPENWEATHER_FORECAST_CNT:-8}
    networks:
      - dap-prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  dap_prod_postgres_data:
  dap_prod_airflow_logs:

networks:
  dap-prod:
    name: dap-prod
