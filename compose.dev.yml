x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: dap-airflow:latest
  env_file:
    - .env
  environment: &airflow-env
    TZ: ${TZ:-Asia/Tokyo}
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-dap-dev-jwt-secret-change-me}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL:-http://airflow-api-server:8080/execution/}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    DBT_TARGET: ${DBT_TARGET:-dev}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
  networks:
    - dap-dev

services:
  postgres:
    image: postgres:16
    container_name: dap-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      PGTZ: ${TZ:-Asia/Tokyo}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SOURCE_DB: ${SOURCE_DB}
      SOURCE_DB_USER: ${SOURCE_DB_USER}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}
      ANALYTICS_DB: ${ANALYTICS_DB}
      DLT_DB_USER: ${DLT_DB_USER}
      DLT_DB_PASSWORD: ${DLT_DB_PASSWORD}
      DBT_DB_USER: ${DBT_DB_USER}
      DBT_DB_PASSWORD: ${DBT_DB_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    command: [ "postgres", "-c", "timezone=${TZ:-Asia/Tokyo}" ]
    ports:
      - "${POSTGRES_PUBLISH_PORT:-15432}:5432"
    volumes:
      - dap_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dap-dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: dap-airflow-init
    command: [ "airflow", "db", "migrate" ]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    container_name: dap-airflow-api-server
    command: [ "airflow", "api-server", "--host", "0.0.0.0", "--port", "8080" ]
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      <<: *airflow-env
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_UI_USER}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./secrets/airflow_ui_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  airflow-scheduler:
    <<: *airflow-common
    container_name: dap-airflow-scheduler
    command: [ "airflow", "scheduler" ]
    restart: unless-stopped
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      # Linuxでは　/var/run/docker.sockなので注意
      - ${HOME}/.docker/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: dap-airflow-dag-processor
    command: [ "airflow", "dag-processor" ]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  dap_postgres_data:

networks:
  dap-dev:
    name: dap-dev
